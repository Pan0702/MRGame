bAllowClientSideNavigation=True
; MRUKの床メッシュは実行時に生成されるため、NavMeshを動的に再生成する必要がある。
bAutoCreateNavigationData=True
; MR空間にはNavMeshBoundsVolumeを置けない（レベルジオメトリが無い）ため、
; NavigationInvoker（プレイヤー足元の床アクターに付与）の周囲だけNavMeshを実行時生成する。
bGenerateNavigationOnlyAroundNavigationInvokers=True
; ★ランタイム自動生成NavDataに効くのはここ(SupportedAgents)。[RecastNavMesh]のAgentRadiusは
;   手動配置したRecastNavMeshアクター用で、自動生成パスには効かない（実機ログが agent radius 35.0 のままだった）。
; 敵カプセル(半径≈15cm/全高≈141cm)に合わせる。AgentRadius を細くすることで:
;  - 机の周囲が余計に削られすぎない（35→15で削りマージンが20cm減る）
;  - 机と机の間の細い隙間も歩行可能として残る
;  - プレイヤー足元のNavMeshが家具で消えにくくなる
; AgentStepHeight=12 で段差警告も解消。
+SupportedAgents=(Name="Default",AgentRadius=15.000000,AgentHeight=144.000000,AgentStepHeight=12.000000,bCanCrouch=False,bCanJump=False,bCanWalk=True,bCanSwim=False,bCanFly=False)

